name: Build & Push API image
on:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (API)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 👇 Para aislar el problema, prueba primero solo amd64; si va, vuelve a multi-arch
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/beastvault-api:latest
            ghcr.io/${{ github.repository_owner }}/beastvault-api:sha-${{ github.sha }}
          provenance: false
          sbom: false
        env:
          # 👇 Fuerza logs de buildkit en texto plano para verlos en la UI
          BUILDKIT_PROGRESS: plain
