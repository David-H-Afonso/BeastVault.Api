version: "3"

services:
  beastvault-api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: beastvault-api
    ports:
      - "8080:8080"
    volumes:
      - beastvault-data:/app/data
      - beastvault-pokemon:/app/pokemon
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - BEASTVAULT_DB_PATH=/app/data/beastvault.db
      - BEASTVAULT_POKEMON_PATH=/app/pokemon
      - HOUSEHOLD_CLIENT_ID=${HOUSEHOLD_CLIENT_ID:-household}
      - HOUSEHOLD_REDIRECT_URIS=${HOUSEHOLD_REDIRECT_URIS:-http://localhost:5019/integrations/callback/provider}
      - HOUSEHOLD_ACCESS_TOKEN_MINUTES=${HOUSEHOLD_ACCESS_TOKEN_MINUTES:-15}
      - HOUSEHOLD_REFRESH_TOKEN_DAYS=${HOUSEHOLD_REFRESH_TOKEN_DAYS:-30}
      - HOUSEHOLD_AUTHORIZATION_CODE_MINUTES=${HOUSEHOLD_AUTHORIZATION_CODE_MINUTES:-5}
    restart: unless-stopped

volumes:
  beastvault-data:
    # Volumen para la base de datos
  beastvault-pokemon:
    # Volumen para los archivos Pokémon
